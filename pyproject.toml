[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-sim"
version = "0.1.0"
description = "A deterministic local simulation platform for AI agents and Python workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "python-sim contributors" }]
dependencies = []
keywords = ["simulation", "agents", "testing", "mock", "workflow"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
urls = { Homepage = "https://github.com/ArnavBallinCode/python-sim", Repository = "https://github.com/ArnavBallinCode/python-sim", Issues = "https://github.com/ArnavBallinCode/python-sim/issues", Changelog = "https://github.com/ArnavBallinCode/python-sim/blob/main/CHANGELOG.md" }

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/python_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
